name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      AWSTOOLS_OFFLINE: "1"
      MPLBACKEND: Agg
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest
        run: python -m pytest -q --tb=short

      - name: Offline CLI smoke
        run: |
          python -m awstools whoami --quiet
          python -m awstools cost --offline -o /tmp/cost-out --no-export-actions --quiet
          python -m awstools waste --offline -o /tmp/waste-out --quiet
          test -f /tmp/cost-out/report.html
          test -f /tmp/cost-out/summary.json
          test -f /tmp/waste-out/findings.json

  lint-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist/wheel
        run: |
          pip install build
          python -m build
      - name: Twine check
        run: |
          pip install twine
          twine check dist/*
