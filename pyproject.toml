[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awstools"
version = "2.3.0"
description = "AWS FinOps analysis and guarded account cleanup CLI for teams (offline-first development). Created by Jayden Shutt."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Jayden Shutt" },
]
maintainers = [
    { name = "Jayden Shutt" },
]
keywords = [
    "aws",
    "finops",
    "cost-explorer",
    "s3",
    "cloud-ops",
    "cost-optimization",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.26.0",
    "botocore>=1.29.0",
    "pandas>=1.5.0",
    "matplotlib>=3.6.0",
    "jinja2>=3.1.0",
    "numpy>=1.24.0",
    "python-dateutil>=2.8.2",
    "reportlab>=4.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "moto[ec2,s3,sts,cloudwatch]>=5.0.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
awstools = "awstools.cli:main"

[project.urls]
Homepage = "https://github.com/jaydenshutt/awstools"
Repository = "https://github.com/jaydenshutt/awstools"
Issues = "https://github.com/jaydenshutt/awstools/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
awstools = ["policies/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
